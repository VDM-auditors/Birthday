<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Momaversary, Reinette!</title>
    <!-- Birthday Date Gate Script -->
    <script>
        (function() {
            const targetMonth = 7; // July
            const targetDay = 24;  // 24th
            const personName = "Reinette (Momaversary)";
            const birthdayLabel = "July 24th";

            const now = new Date();
            const currentMonth = now.getMonth() + 1;
            const currentDay = now.getDate();
            const urlParams = new URLSearchParams(window.location.search);
            const isPreview = urlParams.get('preview') === 'true';

            const isTodayBirthday = (currentMonth === targetMonth && currentDay === targetDay);

            if (!isTodayBirthday && !isPreview) {
                document.addEventListener('DOMContentLoaded', showPoster);
            }

            function showPoster() {
                document.body.style.overflow = 'hidden';
                const poster = document.createElement('div');
                poster.id = 'not-birthday-poster';
                poster.innerHTML = `
                    <div class="poster-card">
                        <div class="poster-badge">🔒 Anniversary Locked</div>
                        <div class="poster-icon">💖</div>
                        <h1>It's Not Your Celebration Today!</h1>
                        <p class="poster-message">
                            Sorry! This special page is reserved for <strong>${personName}</strong> on their special day (<strong>${birthdayLabel}</strong>).
                        </p>
                        <p class="poster-date-info">Today is ${now.toLocaleDateString('en-US', { month: 'long', day: 'numeric' })}.</p>
                        <div class="poster-actions">
                            <a href="../index.html" class="poster-btn primary-btn">← Back to Birthday Lobby</a>
                            <button id="preview-btn" class="poster-btn secondary-btn">✨ Preview Page Anyway</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(poster);
                document.getElementById('preview-btn').addEventListener('click', function() {
                    poster.remove();
                    document.body.style.overflow = '';
                });
            }
        })();
    </script>
    <style id="poster-styles">
        #not-birthday-poster {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at center, rgba(15, 23, 42, 0.95), rgba(2, 6, 23, 0.98));
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            z-index: 999999; display: flex; align-items: center; justify-content: center;
            padding: 20px; font-family: 'Montserrat', sans-serif; color: #fff;
        }
        #not-birthday-poster .poster-card {
            background: rgba(30, 41, 59, 0.85); border: 1px solid rgba(255, 105, 180, 0.4);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 30px rgba(255, 105, 180, 0.3);
            border-radius: 28px; padding: 44px 32px; max-width: 480px; width: 100%; text-align: center;
            animation: posterPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes posterPop { 0% { transform: scale(0.85); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        #not-birthday-poster .poster-badge {
            display: inline-block; background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5; font-size: 0.8rem; font-weight: 600; padding: 6px 16px; border-radius: 20px;
            margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px;
        }
        #not-birthday-poster .poster-icon { font-size: 4rem; margin-bottom: 16px; animation: floatBalloon 3s ease-in-out infinite; }
        @keyframes floatBalloon { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        #not-birthday-poster h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 14px; color: #fff; }
        #not-birthday-poster .poster-message { font-size: 1rem; color: #94a3b8; line-height: 1.6; margin-bottom: 10px; }
        #not-birthday-poster .poster-message strong { color: #ff69b4; }
        #not-birthday-poster .poster-date-info { font-size: 0.85rem; color: #64748b; margin-bottom: 28px; }
        #not-birthday-poster .poster-actions { display: flex; flex-direction: column; gap: 12px; }
        #not-birthday-poster .poster-btn {
            display: inline-flex; align-items: center; justify-content: center; padding: 14px 24px;
            border-radius: 14px; font-weight: 600; font-size: 0.95rem; text-decoration: none; cursor: pointer; transition: all 0.25s ease; border: none;
        }
        #not-birthday-poster .primary-btn { background: linear-gradient(135deg, #ff69b4, #da70d6); color: #fff; box-shadow: 0 4px 15px rgba(255, 105, 180, 0.4); }
        #not-birthday-poster .primary-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255, 105, 180, 0.6); }
        #not-birthday-poster .secondary-btn { background: rgba(255, 255, 255, 0.08); color: #cbd5e1; border: 1px solid rgba(255, 255, 255, 0.15); }
        #not-birthday-poster .secondary-btn:hover { background: rgba(255, 255, 255, 0.15); color: #fff; }
    </style>
</head>
<body>
    <div class="background-animation"></div>
    <div class="container">
        <header class="hero fade-in">
            <h1 class="title">Happy Momaversary, <span>Reinette</span>!</h1>
            <p class="subtitle">Celebrating an amazing mom and an incredible journey.</p>
        </header>

        <section class="gallery">
            <div class="card slide-up" style="animation-delay: 0.2s;">
                <div class="image-wrapper">
                    <img src="WhatsApp Image 2026-07-24 at 10.55.18 AM.jpeg" alt="Reinette">
                </div>
            </div>
            <div class="card slide-up" style="animation-delay: 0.4s;">
                <div class="image-wrapper">
                    <img src="WhatsApp Image 2026-07-24 at 10.55.18 AM (1).jpeg" alt="Reinette and Shani">
                </div>
            </div>
        </section>

        <section class="boss-lady fade-in" style="animation-delay: 0.6s;">
            <div class="boss-lady-content">
                <h2>...But still a <span class="highlight">corporate boss lady</span>.</h2>
            </div>
        </section>

        <section class="mother-quote fade-in" style="animation-delay: 0.8s;">
            <div class="quote-content">
                <p class="lunchbox-text">From leading the boardroom to <span class="highlight">packing a lunchbox</span>...</p>
                
                <div class="lunchbox-container">
                    <span class="lunch-item toy-float-1">🍱</span>
                    <span class="lunch-item toy-float-2">🥪</span>
                    <span class="lunch-item toy-float-3">🧃</span>
                    <span class="lunch-item toy-float-4">🍎</span>
                    <span class="lunch-item toy-float-5">🍌</span>
                    <span class="lunch-item toy-float-6">🍪</span>
                </div>

                <blockquote>
                    Of all the rights of a women, the greatest is to be a mother.
                </blockquote>
            </div>
        </section>
    </div>

    <script>
        const toys = ['🧸', '🦄', '👑', '🎀', '🩰', '💖', '🪆', '🪄', '🏰', '💎', '👛', '🍭', '🌸', '🎈', '⭐'];
        const numToys = 45;

        for (let i = 0; i < numToys; i++) {
            const toy = document.createElement('div');
            toy.classList.add('toy');
            toy.textContent = toys[Math.floor(Math.random() * toys.length)];
            
            // Random horizontal start position
            toy.style.left = Math.random() * 95 + 'vw';
            
            // Stagger duration & negative delay so toys are scattered across screen instantly
            const duration = 10 + Math.random() * 14;
            const delay = -Math.random() * 20;
            
            toy.style.animationDuration = `${duration}s`;
            toy.style.animationDelay = `${delay}s`;
            
            // Random size
            const size = 1.8 + Math.random() * 2.2;
            toy.style.fontSize = `${size}rem`;
            
            document.body.appendChild(toy);
        }
    </script>
</body>
</html>
