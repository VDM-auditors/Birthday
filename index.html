<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Lobby</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #ff6b9d, #6b8cff);
            padding: 40px 20px;
        }

        .lobby {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            padding: 48px 40px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        }

        h1 {
            font-family: 'Pacifico', cursive;
            font-size: 2.5rem;
            background: linear-gradient(135deg, #ff6b9d, #6b8cff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: #555;
            margin-bottom: 32px;
        }

        .cards {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            display: block;
            padding: 18px 24px;
            border-radius: 14px;
            background: linear-gradient(135deg, #ff6b9d, #ff9a6b);
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 24px rgba(255, 107, 157, 0.4);
        }

        .card:nth-child(2) {
            background: linear-gradient(135deg, #6b8cff, #6bd4ff);
        }

        .card:nth-child(2):hover {
            box-shadow: 0 10px 24px rgba(107, 140, 255, 0.4);
        }
    </style>
</head>
<body>
    <div class="lobby">
        <h1>🎉 Birthday Lobby</h1>
        <p class="subtitle">Pick a name to open their birthday page</p>
        <div class="cards">
            <a class="card" href="Hennie/">Hennie van der Merwe</a>
            <a class="card" href="Hermien/">Hermien van der Sandt</a>
        </div>
    </div>
</body>
</html>
