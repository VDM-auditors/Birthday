<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Momaversary, Reinette!</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-animation"></div>
    <div class="container">
        <header class="hero fade-in">
            <h1 class="title">Happy Momaversary, <span>Reinette</span>!</h1>
            <p class="subtitle">Celebrating an amazing mom and an incredible journey.</p>
        </header>

        <section class="gallery">
            <div class="card slide-up" style="animation-delay: 0.2s;">
                <div class="image-wrapper">
                    <img src="WhatsApp Image 2026-07-24 at 10.55.18 AM.jpeg" alt="Reinette">
                </div>
            </div>
            <div class="card slide-up" style="animation-delay: 0.4s;">
                <div class="image-wrapper">
                    <img src="WhatsApp Image 2026-07-24 at 10.55.18 AM (1).jpeg" alt="Reinette and Shani">
                </div>
            </div>
        </section>

        <section class="boss-lady fade-in" style="animation-delay: 0.6s;">
            <div class="boss-lady-content">
                <h2>...But still a <span class="highlight">corporate boss lady</span>.</h2>
            </div>
        </section>

        <section class="mother-quote fade-in" style="animation-delay: 0.8s;">
            <div class="quote-content">
                <p class="lunchbox-text">From leading the boardroom to <span class="highlight">packing a lunchbox</span>...</p>
                
                <div class="lunchbox-items">
                    <span class="lunch-item" style="animation-delay: 0s;">🍱</span>
                    <span class="lunch-item" style="animation-delay: 1.2s;">🥪</span>
                    <span class="lunch-item" style="animation-delay: 0.5s;">🧃</span>
                    <span class="lunch-item" style="animation-delay: 1.8s;">🍎</span>
                </div>

                <blockquote>
                    Of all the rights of a women, the greatest is to be a mother.
                </blockquote>
            </div>
        </section>
    </div>

    <script>
        const toys = ['🧸', '🚗', '🚂', '🧩', '🪁', '🎈', '🪀', '🚜', '🥁', '🦄', '🦒', '🎲'];
        const numToys = 30;

        for (let i = 0; i < numToys; i++) {
            const toy = document.createElement('div');
            toy.classList.add('toy');
            toy.textContent = toys[Math.floor(Math.random() * toys.length)];
            
            // Random horizontal position
            toy.style.left = Math.random() * 100 + 'vw';
            
            // Random animation delay to stagger the toys
            toy.style.animationDelay = (Math.random() * 10) + 's';
            
            // Random size for variety
            const size = 1.5 + Math.random() * 2;
            toy.style.fontSize = size + 'rem';
            
            // Random horizontal drift (using custom properties or inline transforms)
            // But for simplicity, the CSS animation floatToy handles vertical.
            
            document.body.appendChild(toy);
        }
    </script>
</body>
</html>
